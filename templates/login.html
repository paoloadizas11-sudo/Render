{% extends "base.html" %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p>Sign in to your hosting dashboard.</p>

    <form method="post">
      <div class="field">
        <label>Username</label>
        <input name="username" autocomplete="username" required placeholder="your_username"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
      </div>
      <button class="btn primary full" type="submit">Login →</button>
    </form>

    <p class="auth-foot">No account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</div>

{% endblock %}
